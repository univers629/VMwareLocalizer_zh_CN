name: vmware_localizer
description: "Desktop front-end that localises VMware Workstation Pro 26.0.1 to Simplified Chinese, and can fully restore it."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/payload.zip
